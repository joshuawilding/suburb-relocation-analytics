<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYC Metro Suburb Screener</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
    <header class="app-header">
        <div class="logo">NYC Metro Suburb Screener</div>
        <div class="header-actions">
            <button id="compare-btn" class="btn btn-primary" disabled>Compare Selected (0)</button>
        </div>
    </header>

    <main class="app-main">
        <aside class="sidebar">
            <div class="filter-group">
                <h3>Academics</h3>
                <label data-tooltip="Standardized test scores relative to the national average (0 = Average, 1 = One Grade Level Ahead)">Min Absolute Proficiency (<span id="val-abs">-0.5</span>)</label>
                <input type="range" id="filter-abs" min="-0.5" max="1.5" step="0.05" value="-0.5">
                
                <label data-tooltip="How much students learn each year compared to the national average (0 = Average Growth)">Min SEDA Growth (<span id="val-growth">-0.1</span>)</label>
                <input type="range" id="filter-growth" min="-0.1" max="0.2" step="0.01" value="-0.1">
            </div>

            <div class="filter-group">
                <h3>Demographics & Peers</h3>
                <label data-tooltip="Percentage of the student population identifying as Asian">Min % Asian (<span id="val-asian">0</span>%)</label>
                <input type="range" id="filter-asian" min="0" max="80" step="1" value="0">
                
                <label data-tooltip="Percentage of adults in the district with a Bachelor's Degree or higher">Min % Bachelor's Degree (<span id="val-ba">0</span>%)</label>
                <input type="range" id="filter-ba" min="0" max="95" step="1" value="0">
            </div>

            <div class="filter-group">
                <h3>Politics & Affordability</h3>
                <label data-tooltip="Percentage of the district that voted for the Democratic candidate in the 2020 Presidential Election">Min Democratic Vote (<span id="val-dem">30</span>%)</label>
                <input type="range" id="filter-dem" min="30" max="95" step="1" value="30">
                
                <label data-tooltip="Average price of a 3-bedroom home in the district (Niche.com)">Max 3BR Home Price ($<span id="val-price">2500000</span>)</label>
                <input type="range" id="filter-price" min="400000" max="2500000" step="50000" value="2500000">
                
                <label data-tooltip="Estimated driving commute time to Midtown Manhattan during rush hour">Max Commute (<span id="val-commute">120</span> mins)</label>
                <input type="range" id="filter-commute" min="20" max="120" step="5" value="120">
            </div>
            
            <div class="filter-summary">
                <span id="result-count">0</span> districts match criteria
            </div>
        </aside>

        <section class="content">
            <div class="table-container">
                <table id="results-table">
                    <thead>
                        <tr>
                            <th width="40px"></th>
                            <th data-sort="District_Name">District Name</th>
                            <th data-sort="Current_3BR_Price_Mean" data-tooltip="Average price of a 3-bedroom home">Avg 3BR Price</th>
                            <th data-sort="SEDA_Absolute_Score" data-tooltip="Standardized test scores relative to national avg">Test Score</th>
                            <th data-sort="perasn" data-tooltip="Percentage of the student population identifying as Asian">% Asian</th>
                            <th data-sort="baplusavgall" data-tooltip="Percentage of adults with a Bachelor's Degree or higher">% BA+</th>
                            <th data-sort="Dem_Vote_Share_2020" data-tooltip="Percentage of the district that voted Democrat in 2020">% Dem</th>
                            <th data-sort="Drive_Mins_To_Manhattan" data-tooltip="Estimated driving commute time to Midtown Manhattan">Commute</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Comparison Modal -->
    <div id="compare-modal" class="modal hidden">
        <div class="modal-content">
            <header class="modal-header">
                <h2>Head-to-Head Comparison</h2>
                <button id="close-modal" class="btn-close">&times;</button>
            </header>
            <div class="comparison-grid" id="comparison-grid">
                <!-- Populated by JS -->
            </div>
        </div>
    </div>

    <script src="data.js?v=6"></script>
    <script src="app.js?v=6"></script>
</body>
</html>
